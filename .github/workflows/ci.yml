name: CI

# Runs on PRs, and is called by deploy.yml as a pre-deploy gate on main
# (reusable workflow). Each job runs only when its module changed: PRs detect
# changes here, pushes get the caller's detection passed in via the *_changed
# inputs (defaults 'true', so a bare call still checks everything).
on:
  pull_request:
  workflow_call:
    inputs:
      backend_changed:
        description: 'backend/ had changes in this push'
        type: string
        default: 'true'
      frontend_changed:
        description: 'frontend/ had changes in this push'
        type: string
        default: 'true'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.set.outputs.backend }}
      frontend: ${{ steps.set.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed paths (PRs)
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          PR_BACKEND: ${{ steps.filter.outputs.backend }}
          PR_FRONTEND: ${{ steps.filter.outputs.frontend }}
          CALLER_BACKEND: ${{ inputs.backend_changed }}
          CALLER_FRONTEND: ${{ inputs.frontend_changed }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "backend=$PR_BACKEND" >> "$GITHUB_OUTPUT"
            echo "frontend=$PR_FRONTEND" >> "$GITHUB_OUTPUT"
          else
            echo "backend=$CALLER_BACKEND" >> "$GITHUB_OUTPUT"
            echo "frontend=$CALLER_FRONTEND" >> "$GITHUB_OUTPUT"
          fi

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      # btls-sys (wreq) builds BoringSSL and runs bindgen -> needs cmake + libclang
      # (cmake is preinstalled but libclang is not). GitHub's default apt CDN
      # (azure.archive.ubuntu.com) throttles to ~50 kB/s — a 47 MB install took
      # 14 min in #44796311565. Swap to a fast mirror and cache the packages so
      # only the first run (or after cache eviction) hits the network.
      - name: Swap in a fast apt mirror
        run: sudo sed -i 's|azure\.archive\.ubuntu\.com|mirrors.edge.kernel.org|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources || true
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: cmake libclang-dev
          version: ubuntu-24.04-v1
          empty_packages_behavior: error
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
