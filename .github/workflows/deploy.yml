# Push to main: run CI, build the backend and frontend images, push them to GHCR,
# then SSH to the VPS and restart the stack. Same VPS and flow as halosyahrul.com.
#
# This app has no public ports: it joins the shared `edge` Docker network and
# halosyahrul.com's Caddy routes https://ig.halosyahrul.com to ig-web / ig-api.
#
# Required repo secrets:
#   VPS_HOST         — VPS public IP
#   VPS_USER         — SSH user
#   VPS_SSH_KEY      — private deploy key (its public half is in the VPS's ~/.ssh/authorized_keys)
# Optional:
#   VPS_PORT         — SSH port (default 22)
#   VPS_TARGET_PATH  — deploy dir (default /opt/ig)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serializes rollouts: back-to-back merges queue instead of racing on the VPS.
concurrency:
  group: deploy-production

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  image:
    needs: checks
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # The Next.js rewrites are compiled into the build, so the API host must
          # be the compose service name, not localhost.
          build-args: |
            BACKEND_URL=http://ig-api:8080
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: image
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: deploy/compose.yaml
          target: ${{ secrets.VPS_TARGET_PATH || '/opt/ig' }}
          strip_components: 1
      - name: Roll out
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          envs: DEPLOY_DIR,GHCR_USER,GHCR_TOKEN
          # Pull with the job token (works for a private GHCR package) in a
          # throwaway DOCKER_CONFIG, so no registry login is left on the VPS.
          # `edge` is the network shared with halosyahrul.com's Caddy.
          script: |
            cd "$DEPLOY_DIR"
            docker network inspect edge >/dev/null 2>&1 || docker network create edge
            # First deploy: seed the session file (empty = anonymous mode), owned by
            # the backend uid so in-app renewal can rewrite it.
            if [ ! -f .env ]; then printf 'IG_SESSIONID=\n' > .env; fi
            sudo chown 65534:65534 .env
            PULL_CONFIG=$(mktemp -d)
            echo "$GHCR_TOKEN" | DOCKER_CONFIG="$PULL_CONFIG" docker login ghcr.io -u "$GHCR_USER" --password-stdin
            DOCKER_CONFIG="$PULL_CONFIG" docker compose pull
            rm -rf "$PULL_CONFIG"
            docker compose up -d --remove-orphans
            docker image prune -f
        env:
          DEPLOY_DIR: ${{ secrets.VPS_TARGET_PATH || '/opt/ig' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
