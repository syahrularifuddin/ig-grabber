name: AI PR Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number
        required: true
      head_sha:
        description: Expected full 40-character PR head SHA
        required: true
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

# The repository settings must require both this status and CI. The default branch
# must contain this workflow before an untrusted PR can trigger it.

concurrency:
  group: ai-review-${{ github.repository }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    steps:
      # This is the trusted default branch, never the untrusted PR checkout.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-actions: read
      - name: Review PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STATUS_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://midas-stage.telkomdigital.id/karpathy' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'dpe/alias/deepseek-flash' }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_WORKFLOW: ci.yml
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: node .github/scripts/llm-review.mjs
