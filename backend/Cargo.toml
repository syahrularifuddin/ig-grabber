[package]
name = "ig-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
wreq = { version = "0.16", features = ["form", "stream", "gzip", "brotli", "deflate", "charset", "cookies"] }
wreq-util = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
