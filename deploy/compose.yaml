# Production stack on the VPS, next to halosyahrul.com. CI copies this file to the
# deploy dir and runs `docker compose up -d` (see .github/workflows/deploy.yml).
#
# No public ports here: halosyahrul.com's Caddy owns 80/443 and reaches `ig-api`
# and `ig-web` over the shared `edge` Docker network
# (https://ig.halosyahrul.com, /api/* and /download to the API, the rest to the web app).
#
# Services are named ig-* on purpose: compose registers each service name as a DNS
# name on every network it joins, so a plain `web` here would answer for halosyahrul.com's
# `web` on the shared `edge` network and hijack the main site.
#
# IG_SESSIONID lives in .env in the deploy dir on the VPS (never in git). The backend
# reads it via its dotenv loader AND rewrites it when Instagram rolls the cookie or the
# user renews in-app, so the file must be writable by uid 65534 (the backend user).
services:
  ig-api:
    image: ghcr.io/syahrularifuddin/ig-grabber/backend:latest
    volumes:
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [default, edge]
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ig-web:
    image: ghcr.io/syahrularifuddin/ig-grabber/frontend:latest
    # Rewrites are compiled into the build, so this must match the build arg used
    # by CI (deploy.yml). Kept here too so the container env is self-documenting.
    environment:
      BACKEND_URL: http://ig-api:8080
    depends_on:
      ig-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [default, edge]
    restart: unless-stopped
    logging: *logging

networks:
  # Shared with halosyahrul.com's Caddy (and the expense stack) on this VPS.
  edge:
    external: true
